<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transfiere acá · Squishy Juguetes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;background:#FDE7F0;color:#4A0E3A;display:flex;justify-content:center;padding:18px}
.card{background:#fff;max-width:440px;width:100%;border-radius:28px;border:3px solid #4A0E3A;overflow:hidden;padding-bottom:22px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.logo{display:block;width:72%;margin:18px auto 0}.banner{display:block;width:100%}
h1{margin:14px 22px 4px;background:#8E3FB0;color:#fff;border-radius:999px;text-align:center;font-size:26px;padding:8px 0}
p.sub{text-align:center;margin:6px 0 14px;color:#8E3FB0;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;margin:0 18px;padding:10px 4px;border-bottom:1px dashed #eadcf2}
.row span{font-size:12px;color:#9a80a8;display:block}.row b{font-size:16px;word-break:break-all}
.cp{border:0;background:#FDE7F0;color:#4A0E3A;border-radius:12px;padding:8px 10px;font:600 12px Poppins;cursor:pointer;flex-shrink:0;margin-left:8px}
.big{display:block;width:calc(100% - 36px);margin:18px auto 0;border:0;border-radius:16px;padding:16px;font:700 17px Poppins;cursor:pointer;text-align:center;text-decoration:none}
.copyall{background:#FFD43B;color:#4A0E3A}.mp{background:#009EE3;color:#fff}
.mp small{display:block;font:400 12px Poppins;opacity:.9}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#4A0E3A;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s}
.toast.on{opacity:1}.hint{text-align:center;font-size:12px;color:#9a80a8;margin:10px 20px 0}
</style></head><body><div class="card"><img class="logo" src="squishy.png" alt="Squishy Juguetes">
<h1>Transfiere acá</h1><p class="sub">Copia los datos y pégalos en la app de tu banco</p>
<div class="row"><div><span>Nombre</span><b>María Paz Alvarado</b></div><button class="cp" onclick='cp(&quot;Mar\u00eda Paz Alvarado&quot;)'>Copiar</button></div><div class="row"><div><span>RUT</span><b>15.317.355-9</b></div><button class="cp" onclick='cp(&quot;15.317.355-9&quot;)'>Copiar</button></div><div class="row"><div><span>Banco</span><b>Banco Bci</b></div><button class="cp" onclick='cp(&quot;Banco Bci&quot;)'>Copiar</button></div><div class="row"><div><span>Tipo de cuenta</span><b>Cuenta vista</b></div><button class="cp" onclick='cp(&quot;Cuenta vista&quot;)'>Copiar</button></div><div class="row"><div><span>N° de cuenta</span><b>69151369</b></div><button class="cp" onclick='cp(&quot;69151369&quot;)'>Copiar</button></div><div class="row"><div><span>Correo</span><b>pachita22@gmail.com</b></div><button class="cp" onclick='cp(&quot;pachita22@gmail.com&quot;)'>Copiar</button></div>
<button class="big copyall" onclick="cp(ALL,'¡Datos copiados! Pégalos en tu banco')">📋 Copiar todos los datos</button>
<p class="hint">Después de transferir, envía el comprobante 💜</p>

</div><div class="toast" id="t"></div>
<script>
const ALL="María Paz Alvarado\n15.317.355-9\nBanco Bci\nCuenta vista\n69151369\npachita22@gmail.com";
function cp(t,msg){const ok=()=>toast(msg||'Copiado');
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,()=>fb(t,ok))}else fb(t,ok)}
function fb(t,ok){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();a.setSelectionRange(0,99999);try{document.execCommand('copy');ok()}catch(e){}a.remove()}
function toast(m){const e=document.getElementById('t');e.textContent=m;e.classList.add('on');clearTimeout(window._t);window._t=setTimeout(()=>e.classList.remove('on'),1800)}
</script></body></html>
